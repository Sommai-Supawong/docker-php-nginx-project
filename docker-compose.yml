services:
  db:
    image: mariadb:latest
    container_name: lemp_mariadb024
    volumes:
      - ./mariadb/initdb/:/docker-entrypoint-initdb.d
      - ./mariadb/data/:/var/lib/mysql/
    environment:
      - MYSQL_ROOT_PASSWORD=1234
      - MYSQL_DATABASE=sample_db
      - MYSQL_USER=admin
      - MYSQL_PASSWORD=1234
    restart: always
    # restart: unless-stopped
    networks:
      - web_maiy
  php:
    depends_on:
      - db
    build: php/
    container_name: lemp_php024
    environment:
      DB_HOST: db
      DB_NAME: sample_db
      DB_USER: admin
      DB_PASSWORD: 1234
    volumes:
      - ./public_html/:/var/www/html
    expose:
      - "9000"
    restart: always
    networks:
      - web_maiy
  nginx:
    image: nginx:stable-alpine
    container_name: lemp_nginx024
    volumes:
      - ./public_html/:/var/www/html
      - ./nginx/conf/nginx.conf:/etc/nginx/conf/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    ports:
      - "8824:80"
    restart: always
    networks:
      - web_maiy
networks:
  web_maiy:
    name: lemp
    driver: bridge
